[package]
name = "firequant"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description.workspace = true
repository.workspace = true
readme = "../README.md"

[features]
default = ["polars"]
polars = ["dep:firequant-polars"]

[dependencies]
firequant-core = { workspace = true }
firequant-backtest = { workspace = true }
firequant-exec = { workspace = true }
firequant-polars = { workspace = true, optional = true }
chrono = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
polars = { workspace = true }

[[example]]
name = "eodhd_rsi_backtest"
path = "../examples/eodhd_rsi_backtest.rs"

[[example]]
name = "order_sim"
path = "../examples/order_sim.rs"
