[package]
name = "firequant-backtest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Vectorized and streaming portfolio simulation for FIRE (Polars long-format, costs, metrics, walk-forward)."
repository.workspace = true
homepage.workspace = true
readme = "../README.md"
documentation = "https://docs.rs/firequant-backtest"
categories.workspace = true
keywords.workspace = true

# Stricter than workspace defaults: production paths must not panic (firequant-5ipk.4).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
panic = "deny"
unwrap_used = "deny"
expect_used = "deny"
needless_range_loop = "allow"
type_complexity = "allow"
too_many_arguments = "allow"

[dependencies]
firequant-core = { workspace = true }
polars = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }
rand = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }
approx = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "backtest_vs_naive"
harness = false
