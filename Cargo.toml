[workspace]
members = [
    "firequant",
    "firequant-core",
    "firequant-exec",
    "firequant-backtest",
    "firequant-polars",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/finxsight/firequant"
homepage = "https://github.com/finxsight/firequant"
description = "FIRE quant toolkit: indicators, backtest, and Polars integration (QuantWave-derived)."
authors = ["Finxsight"]
readme = "README.md"
categories = ["science", "mathematics", "finance"]
keywords = ["trading", "technical-analysis", "backtesting", "polars", "finance"]

[workspace.dependencies]
polars = { version = "0.46", features = ["lazy", "dtype-struct", "moment", "cum_agg", "rank"] }
polars-core = { version = "0.46" }
polars-arrow = { version = "0.46" }
talib-rs = "0.1"
proptest = "1.0"
approx = "0.5"
serde = { version = "1.0", features = ["derive"] }
rustfft = "6"
rand = "0.10"
serde_json = "1.0"
criterion = { version = "0.8", features = ["html_reports"] }
log = "0.4"
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
nalgebra = { version = "0.35", features = ["serde-serialize"] }
statrs = "0.19"
anyhow = "1.0.102"
firequant-core = { path = "firequant-core", version = "0.1.0" }
firequant-backtest = { path = "firequant-backtest", version = "0.1.0" }
firequant-exec = { path = "firequant-exec", version = "0.1.0" }
firequant-polars = { path = "firequant-polars", version = "0.1.0" }

[profile.dev]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true

[profile.test]
opt-level = 0
debug = 1
codegen-units = 256
incremental = true

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "warn"
expect_used = "warn"
excessive_precision = "allow"
approx_constant = "allow"
upper_case_acronyms = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
items_after_test_module = "allow"
