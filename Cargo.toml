[workspace]
members = ["firequant", "firequant-core", "firequant-exec"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/finxsight/firequant"
description = "FIRE lean Rust execution engine and streaming quant primitives (QuantWave-derived)."
authors = ["Finxsight"]
readme = "README.md"
categories = ["science", "finance"]
keywords = ["trading", "backtesting", "execution", "quantitative-finance"]

[workspace.dependencies]
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
firequant-core = { path = "firequant-core", version = "0.1.0" }
firequant-exec = { path = "firequant-exec", version = "0.1.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
panic = "deny"
unwrap_used = "warn"
expect_used = "warn"
